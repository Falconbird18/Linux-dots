# Material You terminal — DMS owns the palette; this file owns the layout.
shell /usr/bin/fish
font_family Space Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Airy spacing for both light and dark palettes.
window_padding_width 16
remember_window_size no
initial_window_width 100c
initial_window_height 30c
dynamic_background_opacity yes
window_border_width 0
inactive_text_alpha 0.85

cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0.0
url_style curly
allow_hyperlinks yes
shell_integration enabled

# A portable fallback, then DMS's wallpaper-derived colors when available.
include current-theme.conf
globinclude dank-theme.conf
globinclude dank-tabs.conf

# Keep opacity consistent even if a generated theme specifies its own.
background_opacity 0.90

# Keep DMS's tab colors while using softer pill silhouettes.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 8
tab_bar_margin_height 6 6
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template " {index}: {title[:24]}{title[24:] and '…'} {bell_symbol}{activity_symbol} "
active_tab_title_template " {index}: {title[:24]}{title[24:] and '…'} {bell_symbol}{activity_symbol} "
tab_activity_symbol ●
