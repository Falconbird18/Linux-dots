
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[](fg:blue)\
$os\
$username\
[](fg:blue bg:bright-black)\
$directory\
[](fg:bright-black bg:cyan)\
$git_branch\
$git_status\
[](fg:cyan bg:magenta)\
$nodejs\
$python\
$rust\
$golang\
[](fg:magenta bg:yellow)\
$cmd_duration\
[](fg:yellow bg:green)\
$time\
[](fg:green)\
$character"""

[os]
disabled = false
style = "bg:blue fg:bright-white"
format = "[$symbol]($style)"

[os.symbols]
Arch = "󰣇 "
Ubuntu = "󰕈 "
Macos = "󰀵 "
Windows = " "
Linux = "󰌽 "
NixOS = " "
Fedora = "󰣛 "
Debian = "󰣚 "

[username]
show_always = false
style_user = "bg:blue fg:bright-white"
style_root = "bg:red fg:bright-white"
format = "[ $user ]($style)"

[directory]
style = "bg:bright-black fg:bright-cyan"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " "

[git_branch]
symbol = " "
style = "bg:cyan fg:bright-black"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:cyan fg:bright-red"
format = '[$all_status$ahead_behind]($style)'

[nodejs]
symbol = " "
style = "bg:magenta fg:bright-white"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "bg:magenta fg:bright-yellow"
format = '[[ $symbol($version)(\($virtualenv\)) ]($style)]'

[rust]
symbol = " "
style = "bg:magenta fg:bright-white"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "bg:magenta fg:bright-cyan"
format = "[ $symbol($version) ]($style)"

[cmd_duration]
min_time = 500
style = "bg:yellow fg:bright-black"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:green fg:bright-black"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold bright-green)"
error_symbol = "[❯](bold bright-red)"
vimcmd_symbol = "[❮](bold bright-yellow)"
