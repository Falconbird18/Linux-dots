"$schema" = 'https://starship.rs/config-schema.json'

# Named ANSI colors follow Kitty/DMS, including live palette updates.
# Only the directory uses a filled surface; optional modules carry no empty caps.
add_newline = true
format = """
$username$hostname\
[](blue)$directory[](blue)\
$git_branch$git_status\
$nodejs$python$rust$golang\
$cmd_duration$jobs\
$line_break$character"""
right_format = "$time"

[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

[directory]
style = "bg:blue fg:black bold"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " ro"
read_only_style = "bg:blue fg:black"

[git_branch]
symbol = "git "
style = "bold cyan"
format = "[  $symbol$branch(:$remote_branch)]($style)"
truncation_length = 28

[git_status]
style = "yellow"
format = '([ $all_status$ahead_behind]($style))'
conflicted = "≠${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕↑${ahead_count}↓${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "×${count} "

[nodejs]
symbol = "node "
style = "green"
format = "[  $symbol$version]($style)"

[python]
symbol = "py "
style = "yellow"
format = '[  $symbol$version( \($virtualenv\))]($style)'

[rust]
symbol = "rs "
style = "red"
format = "[  $symbol$version]($style)"

[golang]
symbol = "go "
style = "cyan"
format = "[  $symbol$version]($style)"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[  ◷ $duration]($style)"

[jobs]
symbol = "● "
style = "magenta"
format = "[  $symbol$number]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
