# Managed by surface11-camera
# Capture belongs to the relay processes, not the audio session manager.
# USB/V4L2 webcams keep their normal monitor; Surface webcams use our publishers.
wireplumber.profiles = { main = { monitor.libcamera = disabled } }
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.path = /dev/video42 } { api.v4l2.path = /dev/video43 } ]
    actions = { update-props = { device.disabled = true } }
  }
]
