# Managed by surface11-camera
wireplumber.components = [
  { name = surface11-camera-policy.lua, type = script/lua,
    provides = custom.surface11-camera-policy,
    requires = [ policy.client.access ] }
]
wireplumber.profiles = { main = { custom.surface11-camera-policy = required } }
monitor.libcamera.rules = [
  {
    matches = [
      { node.name = libcamera_input.__SB_.PC00.I2C5.CAMF }
      { node.name = libcamera_input.__SB_.PC00.I2C3.CAMR }
    ]
    actions = { update-props = {
      media.role = SurfaceBackend
      node.description = "Surface camera internal backend"
      priority.session = 0
    } }
  }
]
# Explicit publisher services create these nodes only after the writer is ready.
# Disable monitor copies so boot timing cannot produce duplicates or stale caps.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.path = /dev/video42 } { api.v4l2.path = /dev/video43 } ]
    actions = { update-props = { device.disabled = true } }
  }
]
